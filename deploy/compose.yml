# Lives next to .env, web.env and local_rules.json on the server (none in git). See deploy/README.md.
# .env must set FINANZAS_DOMAIN and PANEL_DOMAIN (e.g. finanzas.example.dev, panel.example.dev) plus the
# secrets listed in the README; web.env holds the web panel's own settings (see web/README.md).
services:
  finanzas:
    build: .
    image: finanzas-mcp
    container_name: finanzas-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      FINANZAS_PUBLIC_URL: https://${FINANZAS_DOMAIN:?set FINANZAS_DOMAIN in .env}
    volumes:
      - ./local_rules.json:/app/local_rules.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    # No published ports: only Caddy reaches it.

  web:
    build: ./web
    image: finanzas-web
    container_name: finanzas-web
    restart: unless-stopped
    env_file: web.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    container_name: finanzas-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      FINANZAS_DOMAIN: ${FINANZAS_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [finanzas, web]

volumes:
  caddy_data:
  caddy_config:
